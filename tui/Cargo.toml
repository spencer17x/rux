[package]
name = "rux-tui"
version = "0.1.0"
edition = "2024"
description = "Grok Build-inspired terminal client foundation for the RUX runtime"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
unicode-width = "0.2"

[dev-dependencies]

[lints.clippy]
all = "warn"
pedantic = "warn"
