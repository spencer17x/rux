<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Rux · 紧凑界面与生成状态</title><style>*{box-sizing:border-box}body{margin:20px;background:#f1f3f6;color:#263142;font:13px system-ui}nav{display:flex;gap:20px;margin-bottom:20px}a{color:#365f9b}h2{font-size:16px;margin:24px 0 12px}section{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}figcaption{margin-bottom:10px;color:#627087}img{width:100%;display:block;border:1px solid #dce2e9;border-radius:8px}p{line-height:1.7;max-width:900px}</style><nav><a href="/?preview=signature&motion=1">打开可交互预览</a><a href="#layout">布局</a><a href="#motion">生成状态</a></nav><h2 id="layout">收紧尺寸，让正文与运行信息各有层级</h2><section><figure><figcaption>之前 · 1280 × 720</figcaption><img src="before.jpg"></figure><figure><figcaption>现在 · 相同窗口、相同两轮内容</figcaption><img src="after.jpg"></figure></section><p>正文 15px，运行信息 12px；侧栏默认 256px，顶栏 52px，发送按钮 40px。每轮 Agent、模型、思考模式、Token 和耗时继续保留，模型胶囊滑杆及已有功能不变。</p><h2 id="motion">生成状态：单一品牌动效，清楚表达等待与输出</h2><section><figure><figcaption>之前 · 转圈、闪字、跳点同时出现</figcaption><img src="before-loading.jpg"></figure><figure><figcaption>现在 · Rux 标识呼吸、静态状态文字</figcaption><img src="after-waiting.jpg"></figure></section><p>等待首个响应时显示两行提示；收到内容后收成一行状态，完成后移除。没有虚假进度百分比。开启系统“减少动态效果”时停止呼吸动效。截图仅展示状态外观，动效请在可交互预览中输入文字并发送体验。</p><h2>生成状态细节 · 原始 CSS 尺寸</h2><section><div style="position:relative;overflow:hidden;height:130px;background:white"><img style="position:absolute;width:1280px;max-width:none;left:-320px;top:-380px;border:0;border-radius:0" src="before-loading.jpg"></div><div style="position:relative;overflow:hidden;height:130px;background:white"><img style="position:absolute;width:1280px;max-width:none;left:-320px;top:-430px;border:0;border-radius:0" src="after-waiting.jpg"></div></section></html>
