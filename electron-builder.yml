appId: com.rux.app
productName: Rux
copyright: Copyright © 2026 Rux

directories:
  output: release

files:
  - out/**/*
  - package.json

asar: true

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip

win:
  icon: build/icon.png
  target:
    - nsis

linux:
  icon: build/icon.png
  category: Development
  target:
    - AppImage
    - deb

artifactName: ${productName}-${version}-${os}-${arch}.${ext}
