  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.245'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.245'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.245'
